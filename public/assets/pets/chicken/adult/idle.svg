h d="M 161 236 C 137 278 183 287 185 246 Z" fill="#ed8d6b" stroke="#754a32" stroke-width="4.5"/></g><ellipse cx="183" cy="232" rx="9" ry="7" fill="#efab7d" opacity=".6"/><ellipse cx="251" cy="231" rx="8" ry="6" fill="#efab7d" opacity=".6"/><g id="chicken-adult-idle-eyes" class="eyes"><ellipse cx="199.56" cy="205" rx="7.665" ry="10.219999999999999" fill="#493128" /><ellipse cx="197.37" cy="201.35" rx="2.4819999999999998" ry="3.139" fill="#fff9eb" /><ellipse cx="201.89600000000002" cy="208.65" rx="1.168" ry="1.387" fill="#c98d59" /><ellipse cx="238.25" cy="205" rx="7.665" ry="10.219999999999999" fill="#493128" /><ellipse cx="236.06" cy="201.35" rx="2.4819999999999998" ry="3.139" fill="#fff9eb" /><ellipse cx="240.586" cy="208.65" rx="1.168" ry="1.387" fill="#c98d59" /></g><g id="chicken-adult-idle-beak" ><path d="M 196 232 Q 216 208 236 232 Q 218 248 196 232 Z" fill="#e9a13f" stroke="#754a32" stroke-width="4.5"/><path d="M 203 232 L 229 232" fill="none" stroke="#b3752b" stroke-width="2.7"/></g></g></g></g></svg>