"10.71" ry="14.280000000000001" fill="#493128" /><ellipse cx="262.44" cy="250.9" rx="3.468" ry="4.386" fill="#fff9eb" /><ellipse cx="268.764" cy="261.1" rx="1.6320000000000001" ry="1.938" fill="#c98d59" /></g><g id="chicken-chick-idle-beak" ><path d="M 216 283 Q 236 259 256 283 Q 238 299 216 283 Z" fill="#e9a13f" stroke="#754a32" stroke-width="4.5"/><path d="M 223 283 L 249 283" fill="none" stroke="#b3752b" stroke-width="2.7"/></g></g></g></g></svg>