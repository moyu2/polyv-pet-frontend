.76 275.7 259.06" fill="none" stroke="#754a32" stroke-width="6.12" stroke-linecap="round"/></g><g id="chicken-chick-happy-beak" ><path d="M 218 281 Q 237 265 254 282 L 236 306 Z" fill="#e9a13f" stroke="#754a32" stroke-width="4.5"/><path d="M 223 285 L 249 285 L 236 301 Z" fill="#a6652d" /></g></g></g><g id="chicken-chick-happy-hearts" class="heart"><g transform="translate(370 137) scale(0.76)"><path d="M 0 7 C -26 -12 -19 -30 -6 -26 C -2 -25 0 -22 0 -20 C 4 -32 23 -30 24 -16 C 25 -6 11 3 0 13 Z" fill="#f39aa0" stroke="#754a32" stroke-width="2.7"/></g><g transform="translate(404 203) scale(0.48)"><path d="M 0 7 C -26 -12 -19 -30 -6 -26 C -2 -25 0 -22 0 -20 C 4 -32 23 -30 24 -16 C 25 -6 11 3 0 13 Z" fill="#f39aa0" stroke="#754a32" stroke-width="2.7"/></g></g></g></svg>