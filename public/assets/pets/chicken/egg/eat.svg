 #chicken-egg-eat-root .heart{transform-box:fill-box;animation:chicken_egg_eat_float 2.2s ease-in-out infinite}
 #chicken-egg-eat-root .spark{transform-box:fill-box;transform-origin:center;animation:chicken_egg_eat_shine 1.6s ease-in-out infinite}
 @keyframes chicken_egg_eat_breath{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.989)}}
 @keyframes chicken_egg_eat_wobble{0%,65%,100%{transform:rotate(0)}73%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}91%{transform:rotate(-2deg)}}
