ill="url(#dog-puppy-idle-coat)" stroke="#754a32" stroke-width="5"/><path d="M 200 166 L 219 151 L 222 166 L 241 153 L 243 171" fill="url(#dog-puppy-idle-coat)" stroke="#754a32" stroke-width="5"/><g id="dog-puppy-idle-right-ear" ><path d="M 295 191 C 342 194 358 283 324 312 Q 292 334 283 281 Q 280 231 295 191 Z" fill="url(#dog-puppy-idle-ear)" stroke="#754a32" stroke-width="5"/><path d="M 315 225 Q 332 261 314 290" fill="none" stroke="#efc88f" stroke-width="6" opacity=".65"/></g><g id="dog-puppy-idle-forehead-mark" ><path d="M 226 217 Q 198 184 223 174 Q 220 191 245 178 Q 245 202 226 217 Z" fill="url(#dog-puppy-idle-cream)" /></g><g id="dog-puppy-idle-muzzle" ><ellipse cx="204" cy="289" rx="54" ry="34" fill="url(#dog-puppy-idle-cream)" /></g><ellipse cx="177" cy="271" rx="9" ry="5" fill="#f19a8b" opacity=".43"/><ellipse cx="268" cy="277" rx="12" ry="7" fill="#ed9b88" opacity=".45"/><g id="dog-puppy-idle-eyes" class="eyes"><ellipse cx="193" cy="248" rx="10.5" ry="14" fill="#493128" /><ellipse cx="190" cy="243" rx="3.4" ry="4.3" fill="#fff9eb" /><ellipse cx="196.2" cy="253" rx="1.6" ry="1.9" fill="#c98d59" /><ellipse cx="246" cy="248" rx="10.5" ry="14" fill="#493128" /><ellipse cx="243" cy="243" rx="3.4" ry="4.3" fill="#fff9eb" /><ellipse cx="249.2" cy="253" rx="1.6" ry="1.9" fill="#c98d59" /></g><g id="dog-puppy-idle-nose" ><path d="M 176 278 Q 170 268 185 268 Q 200 269 193 280 Q 185 288 176 278 Z" fill="#5a382b" /><ellipse cx="183" cy="272" rx="4" ry="1.7" fill="#b58b70" /></g><g id="dog-puppy-idle-mouth" ><path d="M 185 285 L 185 298 Q 171 307 166 296 M 185 298 Q 202 310 213 297" fill="none" stroke="#754a32" stroke-width="3.5"/></g></g></g></g></svg>