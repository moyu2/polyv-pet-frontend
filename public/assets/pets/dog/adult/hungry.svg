 #dog-adult-hungry-root .heart{transform-box:fill-box;animation:dog_adult_hungry_float 2.2s ease-in-out infinite}
 #dog-adult-hungry-root .spark{transform-box:fill-box;transform-origin:center;animation:dog_adult_hungry_shine 1.6s ease-in-out infinite}
 @keyframes dog_adult_hungry_breath{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.989)}}
 @keyframes dog_adult_hungry_wobble{0%,65%,100%{transform:rotate(0)}73%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}91%{transform:rotate(-2deg)}}
 @keyframes dog_adult_hungry_nod{0%,100%{transform:rotate(0)}50%{transform:translateY(3px) rotate(-1.4deg)}}
 @keyframes dog_adult_hungry_hop{0%,80%,100%{transform:translateY(0)}35%{transform:translateY(-12px) rotate(-1deg)}}
 @keyframes dog_adult_hungry_tired{0%,100%{transform:translateY(0)}50%{transform:translateY(3px) scale(1,.99)}}
