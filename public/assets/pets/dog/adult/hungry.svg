<svg xmlns="http://www.w3.org/2000/svg" id="dog-adult-hungry-root" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="dog-adult-hungry-title dog-adult-hungry-desc" data-species="dog" data-stage="adult" data-action="hungry">
<title id="dog-adult-hungry-title">成犬 · 饥饿</title><desc id="dog-adult-hungry-desc">透明背景的独立矢量宠物素材，身体部件保留分组；支持减少动态效果偏好。</desc>
<defs>
