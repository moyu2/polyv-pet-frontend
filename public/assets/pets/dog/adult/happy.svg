<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="dog-adult-happy-root" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="dog-adult-happy-title dog-adult-happy-desc" data-species="dog" data-stage="adult" data-action="happy">
<title id="dog-adult-happy-title">成犬 · 开心</title><desc id="dog-adult-happy-desc">透明背景的独立矢量宠物素材，身体部件保留分组；支持减少动态效果偏好。</desc>
<defs>
 <linearGradient id="dog-adult-happy-coat" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#ffe1a0"/><stop offset="1" stop-color="#e8ac55"/></linearGradient>
