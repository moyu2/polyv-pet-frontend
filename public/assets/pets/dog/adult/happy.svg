 </defs><style>
 #dog-adult-happy-root .pet{transform-box:fill-box;transform-origin:50% 100%;animation:dog_adult_happy_hop .9s ease-in-out infinite}
 #dog-adult-happy-root .tail{transform-box:fill-box;transform-origin:10% 85%;animation:dog_adult_happy_wag  .45s ease-in-out infinite}
 #dog-adult-happy-root .heart{transform-box:fill-box;animation:dog_adult_happy_float 2.2s ease-in-out infinite}
 #dog-adult-happy-root .spark{transform-box:fill-box;transform-origin:center;animation:dog_adult_happy_shine 1.6s ease-in-out infinite}
 @keyframes dog_adult_happy_breath{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.989)}}
 @keyframes dog_adult_happy_wobble{0%,65%,100%{transform:rotate(0)}73%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}91%{transform:rotate(-2deg)}}
 @keyframes dog_adult_happy_nod{0%,100%{transform:rotate(0)}50%{transform:translateY(3px) rotate(-1.4deg)}}
 @keyframes dog_adult_happy_hop{0%,80%,100%{transform:translateY(0)}35%{transform:translateY(-12px) rotate(-1deg)}}
 @keyframes dog_adult_happy_tired{0%,100%{transform:translateY(0)}50%{transform:translateY(3px) scale(1,.99)}}
 @keyframes dog_adult_happy_wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(7deg)}}
 @keyframes dog_adult_happy_float{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-9px);opacity:1}}
 @keyframes dog_adult_happy_shine{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
 @media(prefers-reduced-motion:reduce){#dog-adult-happy-root *{animation:none!important}}
 </style>
