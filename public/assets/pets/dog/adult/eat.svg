 @keyframes dog_adult_eat_wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(7deg)}}
 @keyframes dog_adult_eat_float{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-9px);opacity:1}}
 @keyframes dog_adult_eat_shine{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
 @media(prefers-reduced-motion:reduce){#dog-adult-eat-root *{animation:none!important}}
