<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="dog-adult-eat-root" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="dog-adult-eat-title dog-adult-eat-desc" data-species="dog" data-stage="adult" data-action="eat">
<title id="dog-adult-eat-title">成犬 · 进食</title><desc id="dog-adult-eat-desc">透明背景的独立矢量宠物素材，身体部件保留分组；支持减少动态效果偏好。</desc>
