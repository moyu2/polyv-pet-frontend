 </defs><style>
 #dog-adult-eat-root .pet{transform-box:fill-box;transform-origin:50% 100%;animation:dog_adult_eat_nod .65s ease-in-out infinite}
 #dog-adult-eat-root .tail{transform-box:fill-box;transform-origin:10% 85%;animation:dog_adult_eat_wag 1.8s ease-in-out infinite}
 #dog-adult-eat-root .heart{transform-box:fill-box;animation:dog_adult_eat_float 2.2s ease-in-out infinite}
 #dog-adult-eat-root .spark{transform-box:fill-box;transform-origin:center;animation:dog_adult_eat_shine 1.6s ease-in-out infinite}
 @keyframes dog_adult_eat_breath{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.989)}}
 @keyframes dog_adult_eat_wobble{0%,65%,100%{transform:rotate(0)}73%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}91%{transform:rotate(-2deg)}}
