<svg xmlns="http://www.w3.org/2000/svg" id="dog-juvenile-idle-root" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="dog-juvenile-idle-title dog-juvenile-idle-desc" data-species="dog" data-stage="juvenile" data-action="idle">
<title id="dog-juvenile-idle-title">少年犬 · 待机</title><desc id="dog-juvenile-idle-desc">透明背景的独立矢量宠物素材，身体部件保留分组；支持减少动态效果偏好。</desc>
<defs>
