 #dog-juvenile-happy-root .spark{transform-box:fill-box;transform-origin:center;animation:dog_juvenile_happy_shine 1.6s ease-in-out infinite}
 @keyframes dog_juvenile_happy_breath{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.989)}}
