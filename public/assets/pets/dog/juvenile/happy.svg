<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="dog-juvenile-happy-root" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="dog-juvenile-happy-title dog-juvenile-happy-desc" data-species="dog" data-stage="juvenile" data-action="happy">
<title id="dog-juvenile-happy-title">少年犬 · 开心</title><desc id="dog-juvenile-happy-desc">透明背景的独立矢量宠物素材，身体部件保留分组；支持减少动态效果偏好。</desc>
<defs>
