<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="effect-dog-food-root" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="effect-dog-food-title effect-dog-food-desc" data-species="" data-stage="" data-action="idle">
<title id="effect-dog-food-title">狗狗口粮</title><desc id="effect-dog-food-desc">透明背景的独立矢量宠物素材，身体部件保留分组；支持减少动态效果偏好。</desc>
<defs>
 <linearGradient id="effect-dog-food-coat" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#ffe1a0"/><stop offset="1" stop-color="#e8ac55"/></linearGradient>
 <linearGradient id="effect-dog-food-ear" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#e6b679"/><stop offset="1" stop-color="#bd7c3f"/></linearGradient>
 <linearGradient id="effect-dog-food-cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffcef"/><stop offset="1" stop-color="#ffe8bd"/></linearGradient>
 <linearGradient id="effect-dog-food-yellow" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ffe98a"/><stop offset="1" stop-color="#f0bd46"/></linearGradient>
 <linearGradient id="effect-dog-food-egg" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#fffdf1"/><stop offset=".6" stop-color="#ffedc8"/><stop offset="1" stop-color="#e9c88c"/></linearGradient>
 <linearGradient id="effect-dog-food-bowl" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4aa71"/><stop offset="1" stop-color="#ac7647"/></linearGradient>
 <radialGradient id="effect-dog-food-glow"><stop stop-color="#fff9d5" stop-opacity=".95"/><stop offset=".5" stop-color="#ffd86b" stop-opacity=".45"/><stop offset="1" stop-color="#ffd86b" stop-opacity="0"/></radialGradient>
 </defs><style>
 #effect-dog-food-root .pet{transform-box:fill-box;transform-origin:50% 100%;animation:effect_dog_food_breath 3s ease-in-out infinite}
 #effect-dog-food-root .tail{transform-box:fill-box;transform-origin:10% 85%;animation:effect_dog_food_wag 1.8s ease-in-out infinite}
 #effect-dog-food-root .heart{transform-box:fill-box;animation:effect_dog_food_float 2.2s ease-in-out infinite}
 #effect-dog-food-root .spark{transform-box:fill-box;transform-origin:center;animation:effect_dog_food_shine 1.6s ease-in-out infinite}
 @keyframes effect_dog_food_breath{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.989)}}
 @keyframes effect_dog_food_wobble{0%,65%,100%{transform:rotate(0)}73%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}91%{transform:rotate(-2deg)}}
 @keyframes effect_dog_food_nod{0%,100%{transform:rotate(0)}50%{transform:translateY(3px) rotate(-1.4deg)}}
 @keyframes effect_dog_food_hop{0%,80%,100%{transform:translateY(0)}35%{transform:translateY(-12px) rotate(-1deg)}}
 @keyframes effect_dog_food_tired{0%,100%{transform:translateY(0)}50%{transform:translateY(3px) scale(1,.99)}}
 @keyframes effect_dog_food_wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(7deg)}}
 @keyframes effect_dog_food_float{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-9px);opacity:1}}
 @keyframes effect_dog_food_shine{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
 @media(prefers-reduced-motion:reduce){#effect-dog-food-root *{animation:none!important}}
 </style>
<g stroke-linecap="round" stroke-linejoin="round"><g id="effect-dog-food-food" transform="translate(256 280) scale(1.7)"><ellipse cx="0" cy="-8" rx="81" ry="25" fill="#79513a" stroke="#754a32" stroke-width="4"/><ellipse cx="-53" cy="-12" rx="12" ry="8" fill="#bb7c45" stroke="#754a32" stroke-width="2"/><ellipse cx="-36" cy="-23" rx="12" ry="8" fill="#cf9450" stroke="#754a32" stroke-width="2"/><ellipse cx="-16" cy="-15" rx="12" ry="8" fill="#a76a38" stroke="#754a32" stroke-width="2"/><ellipse cx="4" cy="-23" rx="12" ry="8" fill="#bb7c45" stroke="#754a32" stroke-width="2"/><ellipse cx="24" cy="-11" rx="12" ry="8" fill="#cf9450" stroke="#754a32" stroke-width="2"/><ellipse cx="44" cy="-20" rx="12" ry="8" fill="#a76a38" stroke="#754a32" stroke-width="2"/><ellipse cx="-38" cy="-4" rx="12" ry="8" fill="#bb7c45" stroke="#754a32" stroke-width="2"/><ellipse cx="-6" cy="-3" rx="12" ry="8" fill="#cf9450" stroke="#754a32" stroke-width="2"/><ellipse cx="29" cy="-1" rx="12" ry="8" fill="#a76a38" stroke="#754a32" stroke-width="2"/><path d="M -80 -7 Q -76 47 -53 51 L 54 51 Q 76 44 80 -7 Q 1 22 -80 -7 Z" fill="url(#effect-dog-food-bowl)" stroke="#754a32" stroke-width="4.5"/><path d="M -62 11 Q 0 29 61 11" fill="none" stroke="#fff2d4" stroke-width="4" opacity=".6"/></g></g></svg>