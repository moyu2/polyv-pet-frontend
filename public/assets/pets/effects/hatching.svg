<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="effect-hatching-root" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="effect-hatching-title effect-hatching-desc" data-species="" data-stage="" data-action="idle">
<title id="effect-hatching-title">破壳孵化</title><desc id="effect-hatching-desc">透明背景的独立矢量宠物素材，身体部件保留分组；支持减少动态效果偏好。</desc>
<defs>
 <linearGradient id="effect-hatching-coat" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#ffe1a0"/><stop offset="1" stop-color="#e8ac55"/></linearGradient>
 <linearGradient id="effect-hatching-ear" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#e6b679"/><stop offset="1" stop-color="#bd7c3f"/></linearGradient>
 <linearGradient id="effect-hatching-cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffcef"/><stop offset="1" stop-color="#ffe8bd"/></linearGradient>
 <linearGradient id="effect-hatching-yellow" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ffe98a"/><stop offset="1" stop-color="#f0bd46"/></linearGradient>
 <linearGradient id="effect-hatching-egg" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#fffdf1"/><stop offset=".6" stop-color="#ffedc8"/><stop offset="1" stop-color="#e9c88c"/></linearGradient>
 <linearGradient id="effect-hatching-bowl" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4aa71"/><stop offset="1" stop-color="#ac7647"/></linearGradient>
 <radialGradient id="effect-hatching-glow"><stop stop-color="#fff9d5" stop-opacity=".95"/><stop offset=".5" stop-color="#ffd86b" stop-opacity=".45"/><stop offset="1" stop-color="#ffd86b" stop-opacity="0"/></radialGradient>
 </defs><style>
 #effect-hatching-root .pet{transform-box:fill-box;transform-origin:50% 100%;animation:effect_hatching_breath 3s ease-in-out infinite}
 #effect-hatching-root .tail{transform-box:fill-box;transform-origin:10% 85%;animation:effect_hatching_wag 1.8s ease-in-out infinite}
 #effect-hatching-root .heart{transform-box:fill-box;animation:effect_hatching_float 2.2s ease-in-out infinite}
 #effect-hatching-root .spark{transform-box:fill-box;transform-origin:center;animation:effect_hatching_shine 1.6s ease-in-out infinite}
 @keyframes effect_hatching_breath{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.989)}}
 @keyframes effect_hatching_wobble{0%,65%,100%{transform:rotate(0)}73%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}91%{transform:rotate(-2deg)}}
 @keyframes effect_hatching_nod{0%,100%{transform:rotate(0)}50%{transform:translateY(3px) rotate(-1.4deg)}}
 @keyframes effect_hatching_hop{0%,80%,100%{transform:translateY(0)}35%{transform:translateY(-12px) rotate(-1deg)}}
 @keyframes effect_hatching_tired{0%,100%{transform:translateY(0)}50%{transform:translateY(3px) scale(1,.99)}}
 @keyframes effect_hatching_wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(7deg)}}
 @keyframes effect_hatching_float{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-9px);opacity:1}}
 @keyframes effect_hatching_shine{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
 @media(prefers-reduced-motion:reduce){#effect-hatching-root *{animation:none!important}}
 </style>
<g stroke-linecap="round" stroke-linejoin="round"><ellipse cx="256" cy="274" rx="177" ry="177" fill="url(#effect-hatching-glow)" /><g id="effect-hatching-left-shell" class="pet"><path d="M 241 416 Q 135 416 143 307 L 174 325 L 192 300 L 217 326 L 237 310 Z" fill="url(#effect-hatching-egg)" stroke="#754a32" stroke-width="4.5"/></g><g id="effect-hatching-right-shell" class="pet"><path d="M 272 416 Q 381 416 370 307 L 342 327 L 319 299 L 296 327 L 274 312 Z" fill="url(#effect-hatching-egg)" stroke="#754a32" stroke-width="4.5"/></g><g id="effect-hatching-star-0" class="spark"><polygon points="164.00,223.00 167.51,231.16 176.36,231.98 169.69,237.85 171.64,246.52 164.00,241.98 156.36,246.52 158.31,237.85 151.64,231.98 160.49,231.16" fill="#ffd76a" stroke="#754a32" stroke-width="2.5" stroke-linejoin="round"/></g><g id="effect-hatching-star-1" class="spark"><polygon points="253.00,152.00 258.95,165.81 273.92,167.20 262.62,177.13 265.93,191.80 253.00,184.12 240.07,191.80 243.38,177.13 232.08,167.20 247.05,165.81" fill="#ffd76a" stroke="#754a32" stroke-width="2.5" stroke-linejoin="round"/></g><g id="effect-hatching-star-2" class="spark"><polygon points="354.00,200.00 358.33,210.05 369.22,211.06 361.00,218.27 363.40,228.94 354.00,223.36 344.60,228.94 347.00,218.27 338.78,211.06 349.67,210.05" fill="#ffd76a" stroke="#754a32" stroke-width="2.5" stroke-linejoin="round"/></g><g id="effect-hatching-star-3" class="spark"><polygon points="295.00,258.00 297.97,264.91 305.46,265.60 299.81,270.56 301.47,277.90 295.00,274.06 288.53,277.90 290.19,270.56 284.54,265.60 292.03,264.91" fill="#ffd76a" stroke="#754a32" stroke-width="2.5" stroke-linejoin="round"/></g></g></svg>